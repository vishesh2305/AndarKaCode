# Steps 24, 26 and 28: the Builder API as services plus MongoDB, in two profiles, one per production server:
#   server-1: mongo, api, orchestrator, verifier (Step 33c: runs the generated apps, each in a sandbox)
#   server-2: ui-worker (draws the pages), preview (Step 34a: live previews, each in a sandbox); they share
#             only MongoDB with server 1, no disk
# Settings come from deploy/.env (copy deploy/.env.example). From the repo root:
#   one machine (COMPOSE_PROFILES=server-1,server-2):  docker compose -f deploy/docker-compose.yml up --build
#   server 1:  docker compose -f deploy/docker-compose.yml --profile server-1 up --build
#   server 2:  MONGODB_URI=mongodb://<server 1's private address>:27018/builder_db in deploy/.env, then
#              docker compose -f deploy/docker-compose.yml -f deploy/server-2.yml --profile server-2 up --build
# Then open http://127.0.0.1:4000 on server 1.
name: andarkacode

x-builder: &builder
  image: andarkacode/builder-api
  restart: unless-stopped
  depends_on: { mongo: { condition: service_healthy } }
  volumes: [runs:/app/runs]
  environment: &env
    MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/builder_db}
    DEFAULT_MODE: ${DEFAULT_MODE:-local}
    GATEWAY_URL: ${GATEWAY_URL:-}
    GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
    OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    # gateway (Laptop B, development) when GATEWAY_URL is set, else queue: the ui-worker draws the pages
    PAGE_LANE: ${PAGE_LANE:-}
    KEY_VAULT_SECRET: ${KEY_VAULT_SECRET:-} # Step 31: opens people's own AI keys; the same on every service
  extra_hosts: ["host.docker.internal:host-gateway"]

services:
  mongo:
    profiles: [server-1]
    image: mongo:8
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    # For server 2 only. MONGO_BIND must be server 1's PRIVATE address (Tailscale or the provider's private
    # network), never a public one: there is no database login yet (it comes with going live, Step 46).
    ports: ["${MONGO_BIND:-127.0.0.1}:${MONGO_PORT:-27018}:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    <<: *builder
    profiles: [server-1]
    build: { context: .., dockerfile: deploy/Dockerfile } # built once; the orchestrator runs the same image
    environment:
      <<: *env
      ROLE: api
      # Step 34a: where browsers reach the preview service (another site than the UI: 127.0.0.1, while the UI
      # is opened as localhost; a domain of its own when going live)
      PREVIEW_ORIGIN: ${PREVIEW_ORIGIN:-http://127.0.0.1:4001}
      # Step 29: sign-in (deploy/.env.example). Only the api service answers people.
      AUTH: ${AUTH:-off}
      PUBLIC_URL: ${PUBLIC_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SESSION_DAYS: ${SESSION_DAYS:-14}
    ports: ["127.0.0.1:4000:4000"] # this computer only (sign-in or not, until going live: Step 46)

  orchestrator:
    <<: *builder
    profiles: [server-1]
    pull_policy: never # the image the api service built
    environment:
      <<: *env
      ROLE: orchestrator
      PORT: "4100"
      VERIFY_LANE: queue # Step 33c: the verifier service runs the generated apps, not this one
    # no ports: it only talks to MongoDB, the models and the Gateway

  # Step 33c: the one service that runs generated apps, each in its own sandbox (Step 33a). It gets the Docker
  # socket, which is the same as root on this machine, so it runs nothing but our code: it claims work from
  # MongoDB and answers only its health checks. SANDBOX_RUNTIME=runsc (gVisor) on a server that has it.
  verifier:
    <<: *builder
    profiles: [server-1]
    pull_policy: never # the image the api service built
    user: "0:0" # to use the socket; whoever holds it is root on the host anyway
    volumes: [runs:/app/runs, /var/run/docker.sock:/var/run/docker.sock]
    environment:
      <<: *env
      ROLE: verifier
      PORT: "4300"
      SANDBOX: docker
      SANDBOX_REACH: network # it joins each sandbox's network (the door's loopback ports are not reachable from here)
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
      VERIFY_PARALLEL: ${VERIFY_PARALLEL:-2}
    # no ports

  ui-worker:
    <<: *builder
    profiles: [server-2]
    pull_policy: never # the image the api service built; on server 2, deploy/server-2.yml builds it
    depends_on: { mongo: { condition: service_healthy, required: false } } # mongo is on server 1
    volumes: [] # no shared disk: the screenshot and the page travel inside the page job
    environment:
      <<: *env
      ROLE: ui-worker
      PORT: "4200"
      UI_PARALLEL: ${UI_PARALLEL:-4}
      PLACEMENT_MS: ${PLACEMENT_MS:-5}
    # no ports: it claims page jobs from MongoDB and calls the models (Step 26); at start it says how
    # far MongoDB is, and warns past PLACEMENT_MS (Step 28)

  # Step 34a: the live previews, on their own address. The api service asks through MongoDB, with the app's
  # files inside the request (no shared disk); each preview runs in its own sandbox. Like the verifier it
  # gets the Docker socket, and it is the one service that serves generated apps to browsers.
  preview:
    <<: *builder
    profiles: [server-2]
    pull_policy: never # the image the api service built; on server 2, deploy/server-2.yml builds it
    depends_on: { mongo: { condition: service_healthy, required: false } } # mongo is on server 1
    user: "0:0" # to use the socket; whoever holds it is root on the host anyway
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    environment:
      <<: *env
      ROLE: preview
      PREVIEW_PORT: "4001"
      SANDBOX: docker
      SANDBOX_REACH: network
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
      PREVIEW_IDLE_MS: ${PREVIEW_IDLE_MS:-900000}
    ports: ["${PREVIEW_BIND:-127.0.0.1}:4001:4001"]
    healthcheck: # it listens on PREVIEW_PORT only
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 30s

volumes:
  mongo-data:
  runs:
