<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Employees</h1>
        
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Full Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Salary</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows will be generated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SAMPLE_EMPLOYEES = [
            { fullName: "Ann Lee", email: "ann@corp.com", salary: 52000 },
            { fullName: "Raj Patel", email: "raj@corp.com", salary: 61500 },
            { fullName: "Mia Wong", email: "mia@corp.com", salary: 48000 }
        ];

        const tableBody = document.querySelector('tbody');
        SAMPLE_EMPLOYEES.forEach(employee => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td data-field="fullName" class="px-6 py-4 border-b border-gray-200">${employee.fullName}</td>
                <td data-field="email" class="px-6 py-4 border-b border-gray-200">${employee.email}</td>
                <td data-field="salary" class="px-6 py-4 border-b border-gray-200">${employee.salary}</td>
                <td class="px-6 py-4 border-b border-gray-200">
                    <button data-action="update" class="px-3 py-1 text-sm font-medium text-gray-700 bg-gray-100 rounded mr-2">Edit</button>
                    <button data-action="delete" class="px-3 py-1 text-sm font-medium text-gray-700 bg-gray-100 rounded">Delete</button>
                </td>
            `;
            tableBody.appendChild(row);
        });
    </script>
</body>
</html>
