<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Products</h1>
        
        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6">
            <div class="w-full md:w-1/3 mb-4 md:mb-0">
                <input type="text" placeholder="Search products..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" data-action="search">
            </div>
            <div class="w-full md:w-1/3 mb-4 md:mb-0">
                <select class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" data-filter="category">
                    <option>All categories</option>
                </select>
            </div>
            <div class="w-full md:w-1/3 flex justify-end">
                <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors" data-action="create">
                    + Add Product
                </button>
            </div>
        </div>

        <div class="overflow-hidden rounded-lg shadow-md bg-white">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Category</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Price</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">In Stock</th>
                        <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <!-- Sample rows will be rendered here by JavaScript -->
                </tbody>
            </table>
        </div>

        <div class="mt-6 flex justify-between text-sm text-gray-500">
            <span>Showing 1-3 of 24</span>
            <div class="flex space-x-2">
                <button data-action="prevPage" class="px-3 py-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition-colors">&lt;</button>
                <button data-action="prevPage" class="px-3 py-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition-colors">1</button>
                <button data-action="prevPage" class="px-3 py-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition-colors">2</button>
                <button data-action="prevPage" class="px-3 py-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition-colors">3</button>
                <span class="px-3 py-1 bg-gray-200 text-gray-700 rounded">...</span>
                <button data-action="nextPage" class="px-3 py-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition-colors">8</button>
                <button data-action="nextPage" class="px-3 py-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition-colors">&gt;</button>
            </div>
        </div>
    </div>

    <script>
        const SAMPLE_PRODUCTS = [
            { name: "Gel Pen", category: "Stationery", price: 2.5, inStock: true },
            { name: "USB Cable", category: "Electronics", price: 8.99, inStock: false },
            { name: "Notebook", category: "Stationery", price: 4.0, inStock: true }
        ];

        // Render the table rows
        function renderTable() {
            const tbody = document.querySelector('tbody');
            tbody.innerHTML = '';
            
            SAMPLE_PRODUCTS.forEach(product => {
                const row = document.createElement('tr');
                
                const nameCell = document.createElement('td');
                nameCell.dataset.field = 'name';
                nameCell.textContent = product.name;
                row.appendChild(nameCell);
                
                const categoryCell = document.createElement('td');
                categoryCell.dataset.field = 'category';
                categoryCell.textContent = product.category;
                row.appendChild(categoryCell);
                
                const priceCell = document.createElement('td');
                priceCell.dataset.field = 'price';
                priceCell.textContent = `$${product.price.toFixed(2)}`;
                row.appendChild(priceCell);
                
                const inStockCell = document.createElement('td');
                inStockCell.dataset.field = 'inStock';
                inStockCell.textContent = product.inStock ? 'Yes' : 'No';
                row.appendChild(inStockCell);
                
                const actionsCell = document.createElement('td');
                actionsCell.className = 'px-6 py-4 text-right';
                
                const editButton = document.createElement('button');
                editButton.dataset.action = 'update';
                editButton.className = 'px-3 py-1 bg-blue-100 text-blue-700 rounded hover:bg-blue-200 transition-colors';
                editButton.textContent = 'Edit';
                actionsCell.appendChild(editButton);
                
                const deleteButton = document.createElement('button');
                deleteButton.dataset.action = 'delete';
                deleteButton.className = 'px-3 py-1 bg-red-100 text-red-700 rounded hover:bg-red-200 transition-colors';
                deleteButton.textContent = 'Delete';
                actionsCell.appendChild(deleteButton);
                
                row.appendChild(actionsCell);
                
                tbody.appendChild(row);
            });
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            renderTable();
        });
    </script>
</body>
</html>
