<!doctype html><html><head><meta charset="utf-8"><title>Products</title><style>body{font-family:Segoe UI,Arial,sans-serif;background:#f4f6fa;margin:0;padding:28px;color:#1f2937}
h1{font-size:24px;margin:0 0 18px}.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.btn{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:14px}
.btn.s{background:#fff;color:#374151;border:1px solid #d1d5db;padding:5px 10px;font-size:13px}
.btn.g{background:#16a34a}.btn.r{background:#dc2626}
input,select{border:1px solid #d1d5db;border-radius:6px;padding:8px 10px;font-size:14px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px #0001}
th{background:#f9fafb;text-align:left;font-size:13px;color:#6b7280;padding:10px 12px;border-bottom:1px solid #e5e7eb}
td{padding:10px 12px;border-bottom:1px solid #f1f5f9;font-size:14px}
.pill{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.p{background:#fef3c7;color:#92400e}.a{background:#dcfce7;color:#166534}.x{background:#fee2e2;color:#991b1b}.b{background:#dbeafe;color:#1e40af}
.cards{display:flex;gap:14px;margin-bottom:18px}.card{background:#fff;border-radius:8px;padding:14px 18px;box-shadow:0 1px 3px #0001;min-width:170px}
.card div{font-size:13px;color:#6b7280}.card b{font-size:26px}.pager{margin-top:10px;font-size:13px;color:#6b7280;display:flex;justify-content:space-between}
.box{max-width:360px;margin:60px auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 1px 6px #0002}
label{display:block;font-size:13px;margin:12px 0 4px}.full{width:100%;box-sizing:border-box}</style></head><body><h1>Products</h1><div class="bar"><input placeholder="Search products..." style="width:260px">
    <select><option>All categories</option><option>Stationery</option><option>Electronics</option></select><span style="flex:1"></span><button class="btn">+ Add Product</button></div><table><tr><th>Name</th><th>Category</th><th>Price</th><th>In Stock</th><th></th></tr><tr><td>Gel Pen</td><td>Stationery</td><td>$2.50</td><td>Yes</td><td><button class="btn s">Edit</button> <button class="btn s">Delete</button></td></tr><tr><td>USB Cable</td><td>Electronics</td><td>$8.99</td><td>No</td><td><button class="btn s">Edit</button> <button class="btn s">Delete</button></td></tr><tr><td>Notebook</td><td>Stationery</td><td>$4.00</td><td>Yes</td><td><button class="btn s">Edit</button> <button class="btn s">Delete</button></td></tr></table><div class="pager"><span>Showing 1-3 of 24</span><span>&lt; 1 2 3 ... 8 &gt;</span></div></body></html>
